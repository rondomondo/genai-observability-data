[build-system]
requires = ["setuptools>=72", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-observability-data"
version = "0.1.0"
description = "Generate realistic GenAI distributed traces and logs with OTel semantic conventions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "David Kierans", email = "dkierans@gmail.com" }]
keywords = [
    "opentelemetry", "observability", "genai", "traces", "logs",
    "synthetic-data", "testing", "pydantic-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "braintrust>=0.23.0",
    # Core generation
    "numpy>=1.26.0",
    # Pydantic AI — scenario analysis agent, FunctionModel mock
    "pydantic-ai-slim[google]>=1.0.0",
    # Config via environment variables / .env
    "pydantic-settings>=2.2.0",
    # Pydantic v2 for typed models
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
god = "god.__main__:main"

[project.urls]
Homepage = "https://github.com/davek/genai-observability-data"
Issues = "https://github.com/davek/genai-observability-data/issues"

[tool.setuptools.packages.find]
where = [".."]
include = ["god*"]

[tool.setuptools.package-data]
god = ["py.typed"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-v --tb=short --ignore=tests/test_root_cli.py"
