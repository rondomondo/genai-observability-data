receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318


processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Traces -> Jaeger (OTLP gRPC, enabled via COLLECTOR_OTLP_ENABLED=true)
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Traces -> Tempo (OTLP gRPC; required by grafana-exploretraces-app / Traces Drilldown)
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Logs -> Loki (OTLP HTTP; native loki exporter was removed in collector 0.116+)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Metrics -> Prometheus (remote write)
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true


extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger, otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]

  extensions: [health_check]
  telemetry:
    logs:
      level: warn
