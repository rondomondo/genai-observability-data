[project]
name = "vecstore-models"
version = "0.1.0"
description = "Shared Pydantic v2 request/response models for vecstore-api"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vecstore_models"]

[tool.hatch.build.targets.wheel.force-include]
"src/vecstore_models/py.typed" = "vecstore_models/py.typed"

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
