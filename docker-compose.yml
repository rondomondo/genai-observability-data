services:

  # OTel Collector — receives OTLP from god, fans out to Jaeger + Tempo + Loki + Prometheus
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  <-- god sends here
      - "8888:8888"   # Prometheus metrics (collector self-monitoring)
      - "13133:13133" # Health check
    depends_on:
      - jaeger
      - tempo
      - loki
    restart: unless-stopped

  # Jaeger — distributed trace visualisation (Badger storage for persistent deps graph)
  jaeger:
    image: jaegertracing/all-in-one:1.58
    user: root
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-badger:/badger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317"         # OTLP gRPC (internal; collector → jaeger)
    restart: unless-stopped


  # Tempo — distributed trace backend (Traces Drilldown plugin requires Tempo)
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317"        # OTLP gRPC (internal; collector -> tempo)
    restart: unless-stopped

  # Loki — log aggregation backend
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"   # Loki HTTP API
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Grafana — dashboards for traces (via Jaeger/Tempo datasource) and logs (via Loki)
  grafana:
    image: grafana/grafana:12.0.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/god/home.json
      - GF_INSTALL_PLUGINS=grafana-lokioperational-app,grafana-exploretraces-app
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      - loki
      - jaeger
      - tempo
    restart: unless-stopped

  # Prometheus — metrics from OTel collector and god health endpoint
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI
    restart: unless-stopped

  # Redis — vector-capable store (Redis 8 / trixie includes vector search built-in)
  redis:
    image: redis:trixie
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"   # Redis client port
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # embedder-sidecar — sentence-transformers model server (CPU torch, no API key)
  # Bundled in the vecstore profile; override EMBED_MODEL at build time to bake
  # a different model into the image (default: Qwen/Qwen3-Embedding-0.6B).
  embedder-sidecar:
    profiles: [vecstore]
    build:
      context: ./embedder-sidecar
      dockerfile: Dockerfile
      args:
        EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}
    image: embedder-sidecar:dev
    container_name: embedder-sidecar
    restart: unless-stopped
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8001:8001"

  # vecstore-api — FastAPI service for vector storage, semantic cache, and embeddings
  # Excluded from the default stack; start with: docker compose --profile vecstore up -d
  # or via: make vecstore-up (which runs make dev in vecstore-api/ for hot-reload)
  vecstore-api:
    profiles: [vecstore]
    build:
      context: .
      dockerfile: vecstore-api/Dockerfile
    image: vecstore-api:dev
    container_name: vecstore-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: vecstore-api
      LOG_FORMAT: json
      EMBED_BACKEND: sidecar
      EMBED_SIDECAR_URL: http://embedder-sidecar:8001
    depends_on:
      - redis
      - embedder-sidecar

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  jaeger-badger:
  tempo-data:
  redis-data:
