services:

  # OTel Collector — receives OTLP from god, fans out to Jaeger + Loki + Prometheus
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  <-- god sends here
      - "8888:8888"   # Prometheus metrics (collector self-monitoring)
      - "13133:13133" # Health check
    depends_on:
      - jaeger
      - loki
    restart: unless-stopped

  # Jaeger — distributed trace visualisation (Badger storage for persistent deps graph)
  jaeger:
    image: jaegertracing/all-in-one:1.58
    user: root
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-badger:/badger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317"         # OTLP gRPC (internal; collector → jaeger)
    restart: unless-stopped


  # Loki — log aggregation backend
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"   # Loki HTTP API
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Grafana — dashboards for traces (via Jaeger/Tempo datasource) and logs (via Loki)
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      - loki
      - jaeger
    restart: unless-stopped

  # Prometheus — metrics from OTel collector and god health endpoint
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  jaeger-badger:
