name: local-mock
description: Full local stack, no API keys needed. God uses mock agent, vecstore uses
  mock embedder.
god:
  agent_backend: google-cloud
  agent_model: gemini-2.5-flash-lite
  agent_fallback_model: null
  mock_mode: true
  default_traces: 100
  default_rate: 10
  default_batch_size: 50
  vecstore_summarise_traces: true
  vecstore_summarise_logs: true
  vecstore_async_mode: true
  http_rate_ingest: 8
  http_rate_search: 4
  http_rate_cache: 4
  http_rate_admin: 2
  http_rps_ingest: 0
  http_rps_search: 0
  http_rps_cache: 0
  http_rps_admin: 0
  http_retry_attempts: 3
  http_retry_backoff_min: 0.5
  http_retry_backoff_max: 8
vecstore:
  embed_backend: google-cloud
  embed_model: gemini-embedding-001
  embed_dim: 768
  embed_workers: 4
  embed_concurrency: 2
  embed_batch_size: 32
  embed_rate_limit_rpm: 90
  summariser_model: mock-model
  summariser_mock: true
  summariser_concurrency: 7
  cache_hit_threshold: 0.92
  cache_ttl_seconds: 36000
  rate_limit_ingest: 120/minute
  rate_limit_embed: 60/minute
  rate_limit_search: 60/minute
  rate_limit_cache: 60/minute
  rate_limit_summarise: 30/minute
  log_level: DEBUG
  log_format: console
  summariser_rate_limit_rpm: 200
  summariser_backend: mock
