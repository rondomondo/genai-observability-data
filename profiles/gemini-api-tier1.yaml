name: gemini-api-tier1
description: Gemini paid Tier 1. Higher throughput limits - verify RPM against your
  AI Studio dashboard and adjust HTTP_RPS_* accordingly.
god:
  agent_backend: google-cloud
  agent_model: gemini-2.5-flash
  agent_fallback_model: gemini-2.5-flash
  mock_mode: false
  default_traces: 200
  default_rate: 50
  default_batch_size: 64
  vecstore_summarise_traces: true
  vecstore_summarise_logs: true
  vecstore_async_mode: true
  http_rate_ingest: 16
  http_rate_search: 8
  http_rate_cache: 8
  http_rate_admin: 4
  http_rps_ingest: 14
  http_rps_search: 28
  http_rps_cache: 28
  http_rps_admin: 2
  http_retry_attempts: 3
  http_retry_backoff_min: 0.5
  http_retry_backoff_max: 60
vecstore:
  embed_backend: google-cloud
  embed_model: gemini-embedding-001
  embed_dim: 768
  embed_workers: 8
  embed_concurrency: 4
  embed_batch_size: 64
  embed_rate_limit_rpm: 300
  summariser_model: gemini-2.5-flash-lite
  summariser_concurrency: 4
  cache_hit_threshold: 0.92
  cache_ttl_seconds: 3600
  rate_limit_ingest: 1000/minute
  rate_limit_embed: 500/minute
  rate_limit_search: 500/minute
  rate_limit_cache: 500/minute
  rate_limit_summarise: 120/minute
  log_level: DEBUG
  log_format: json
  summariser_backend: google-cloud
credentials:
  GOOGLE_CLOUD_PROJECT: nimble-cortex-498410-u8
  GOOGLE_CLOUD_LOCATION: '""'
editor_enabled: true
