[project]
name = "embedder-sidecar"
version = "0.1.0"
description = "Sentence-transformers embedding sidecar — exposes a local model over HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
# sentence-transformers (and torch) only needed at runtime inside Docker.
# Omitted from dev so tests run without torch on platforms that lack a wheel.
model = [
    "sentence-transformers>=5.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# CPU-only torch wheel index so uv resolves a platform-compatible wheel on
# macOS x86_64 and Linux. The default PyPI torch has no macOS x86_64 wheel.
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
